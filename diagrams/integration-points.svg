<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1162" width="1200" height="1162" role="img" aria-labelledby="t d" font-size="15"><title id="t">Five native integration points</title><desc id="d">NEAR AI and Flywheel bind through five JSON data-contract seams: a provider lane, attestation inside the receipt, a combined verdict, a receipt in the provenance log, and MCP composition for the agent market.</desc><style>
    text { font-family:'Hanken Grotesk','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
    .mono { font-family:'Conso',ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,monospace; }
    .ink{fill:#FBF4FC} .ink2{fill:#DDD4E0} .muted{fill:#C2B3C8} .faint{fill:#9784A2}
    .ok{fill:#99F147} .amber{fill:#FF8334} .red{fill:#E23A3D}
    .lbl{letter-spacing:0.16em}
    </style><defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#1B0A23"/>
      <stop offset="100%" stop-color="#14041B"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#99F147"/>
      <stop offset="100%" stop-color="#99F147" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/></filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#C2B3C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arwok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#99F147" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs><rect width="1200" height="1162" fill="#14041B"/><rect width="1200" height="1162" fill="url(#bg)"/><rect width="1200" height="1162" filter="url(#grain)" opacity="0.030"/><text x="56" y="74" class="ink" font-size="33" font-weight="800" text-anchor="start"><tspan x="56" dy="0">Five native integration points</tspan></text><text x="56" y="106" class="muted" font-size="16.5" font-weight="400" text-anchor="start"><tspan x="56" dy="0">Each seam is a JSON data contract, not an internal call. Either side can change without breaking the other.</tspan></text><text x="1144" y="74" class="mono faint" font-size="13" text-anchor="end" letter-spacing="0.16em">FIGURE 03</text><text x="120" y="150" class="mono faint" font-size="12" text-anchor="middle" letter-spacing="0.16em">NEAR AI</text><text x="1080" y="150" class="mono faint" font-size="12" text-anchor="middle" letter-spacing="0.16em">FLYWHEEL</text><g><circle cx="600.0" cy="145" r="12.00" fill="none" stroke="#99F147" stroke-width="1" opacity="0.2"/><circle cx="600.0" cy="145" r="8.88" fill="none" stroke="#99F147" stroke-width="1" opacity="0.3"/><circle cx="600.0" cy="145" r="6.00" fill="none" stroke="#99F147" stroke-width="1" opacity="0.42"/><circle cx="600.0" cy="145" r="16.08" fill="none" stroke="#99F147" stroke-width="5" opacity="0.22" stroke-dasharray="1 7" stroke-linecap="round"/><circle cx="600.0" cy="145" r="5.04" fill="url(#core)" filter="url(#glow)"/><circle cx="600.0" cy="145" r="2.50" fill="#FFFFFF"/></g><text x="600.0" y="176" class="mono faint" font-size="11" text-anchor="middle" letter-spacing="0.10em">seam = JSON data contract</text><line x1="120" y1="186" x2="120" y2="976" stroke="rgba(151,132,162,0.22)" stroke-width="1.4" opacity="1" stroke-linecap="round"/><line x1="1080" y1="186" x2="1080" y2="976" stroke="rgba(151,132,162,0.22)" stroke-width="1.4" opacity="1" stroke-linecap="round"/><rect x="172" y="178" width="856" height="150" rx="7" fill="#20112A" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><line x1="120" y1="253.0" x2="172" y2="253.0" stroke="rgba(151,132,162,0.22)" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/><line x1="1028" y1="253.0" x2="1080" y2="253.0" stroke="rgba(151,132,162,0.22)" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/><circle cx="120" cy="253.0" r="3.4" fill="#99F147" opacity="0.85"/><circle cx="1080" cy="253.0" r="3.4" fill="#99F147" opacity="0.85"/><text x="202" y="230" class="mono" font-size="30" font-weight="700" fill="#FBF4FC" opacity="0.92">01</text><g><circle cx="214" cy="270" r="15.00" fill="none" stroke="#99F147" stroke-width="1" opacity="0.2"/><circle cx="214" cy="270" r="11.10" fill="none" stroke="#99F147" stroke-width="1" opacity="0.3"/><circle cx="214" cy="270" r="7.50" fill="none" stroke="#99F147" stroke-width="1" opacity="0.42"/><circle cx="214" cy="270" r="20.10" fill="none" stroke="#99F147" stroke-width="5" opacity="0.22" stroke-dasharray="1 7" stroke-linecap="round"/><circle cx="214" cy="270" r="6.30" fill="url(#core)" filter="url(#glow)"/><circle cx="214" cy="270" r="2.50" fill="#FFFFFF"/></g><text x="268" y="222" class="ink" font-size="18.5" font-weight="750" text-anchor="start"><tspan x="268" dy="0">NEAR AI as a Flywheel provider lane</tspan></text><text x="268" y="250" class="ink2" font-size="13.8" font-weight="400" text-anchor="start"><tspan x="268" dy="0">One more endpoint behind Flywheel&#x27;s OpenAI-compatible surface. The lane</tspan><tspan x="268" dy="20">captures the TEE attestation quote alongside the completion, so the run&#x27;s</tspan><tspan x="268" dy="20">evidence travels with the result from the first hop.</tspan></text><line x1="254" y1="196" x2="254" y2="310" stroke="rgba(151,132,162,0.12)" stroke-width="1" opacity="1" stroke-linecap="round"/><line x1="778" y1="196" x2="778" y2="310" stroke="rgba(151,132,162,0.12)" stroke-width="1" opacity="1" stroke-linecap="round"/><rect x="792" y="215.0" width="214" height="30" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><rect x="792" y="215.0" width="3.5" height="30" fill="#9784A2"/><text x="806" y="230.0" class="mono" font-size="11.5" font-weight="600" fill="#9784A2" dominant-baseline="central" letter-spacing="0.04em">NEAR</text><text x="845.6" y="230.0" class="mono" font-size="11.5" fill="#DDD4E0" dominant-baseline="central">confidential endpoint</text><rect x="792" y="261.0" width="214" height="30" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><rect x="792" y="261.0" width="3.5" height="30" fill="#99F147"/><text x="806" y="276.0" class="mono" font-size="11.5" font-weight="600" fill="#99F147" dominant-baseline="central" letter-spacing="0.04em">FLYW</text><text x="845.6" y="276.0" class="mono" font-size="11.5" fill="#DDD4E0" dominant-baseline="central">provider lane</text><rect x="172" y="342" width="856" height="150" rx="7" fill="#20112A" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><line x1="120" y1="417.0" x2="172" y2="417.0" stroke="rgba(151,132,162,0.22)" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/><line x1="1028" y1="417.0" x2="1080" y2="417.0" stroke="rgba(151,132,162,0.22)" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/><circle cx="120" cy="417.0" r="3.4" fill="#99F147" opacity="0.85"/><circle cx="1080" cy="417.0" r="3.4" fill="#99F147" opacity="0.85"/><text x="202" y="394" class="mono" font-size="30" font-weight="700" fill="#FBF4FC" opacity="0.92">02</text><g><circle cx="214" cy="434" r="15.00" fill="none" stroke="#99F147" stroke-width="1" opacity="0.2"/><circle cx="214" cy="434" r="11.10" fill="none" stroke="#99F147" stroke-width="1" opacity="0.3"/><circle cx="214" cy="434" r="7.50" fill="none" stroke="#99F147" stroke-width="1" opacity="0.42"/><circle cx="214" cy="434" r="20.10" fill="none" stroke="#99F147" stroke-width="5" opacity="0.22" stroke-dasharray="1 7" stroke-linecap="round"/><circle cx="214" cy="434" r="6.30" fill="url(#core)" filter="url(#glow)"/><circle cx="214" cy="434" r="2.50" fill="#FFFFFF"/></g><text x="268" y="386" class="ink" font-size="18.5" font-weight="750" text-anchor="start"><tspan x="268" dy="0">Attestation inside the proof envelope</tspan></text><text x="268" y="414" class="ink2" font-size="13.8" font-weight="400" text-anchor="start"><tspan x="268" dy="0">The receipt schema gains an attestation field carrying issuer, measurement,</tspan><tspan x="268" dy="20">and verdict. The receipt then reads: this answer, from this attested run,</tspan><tspan x="268" dy="20">re-derives to this verdict. Both halves live in one artifact.</tspan></text><line x1="254" y1="360" x2="254" y2="474" stroke="rgba(151,132,162,0.12)" stroke-width="1" opacity="1" stroke-linecap="round"/><line x1="778" y1="360" x2="778" y2="474" stroke="rgba(151,132,162,0.12)" stroke-width="1" opacity="1" stroke-linecap="round"/><rect x="792" y="379.0" width="214" height="30" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><rect x="792" y="379.0" width="3.5" height="30" fill="#9784A2"/><text x="806" y="394.0" class="mono" font-size="11.5" font-weight="600" fill="#9784A2" dominant-baseline="central" letter-spacing="0.04em">NEAR</text><text x="845.6" y="394.0" class="mono" font-size="11.5" fill="#DDD4E0" dominant-baseline="central">attestation quote</text><rect x="792" y="425.0" width="214" height="30" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><rect x="792" y="425.0" width="3.5" height="30" fill="#99F147"/><text x="806" y="440.0" class="mono" font-size="11.5" font-weight="600" fill="#99F147" dominant-baseline="central" letter-spacing="0.04em">FLYW</text><text x="845.6" y="440.0" class="mono" font-size="11.5" fill="#DDD4E0" dominant-baseline="central">receipt.attestation</text><rect x="172" y="506" width="856" height="150" rx="7" fill="#20112A" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><line x1="120" y1="581.0" x2="172" y2="581.0" stroke="rgba(151,132,162,0.22)" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/><line x1="1028" y1="581.0" x2="1080" y2="581.0" stroke="rgba(151,132,162,0.22)" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/><circle cx="120" cy="581.0" r="3.4" fill="#99F147" opacity="0.85"/><circle cx="1080" cy="581.0" r="3.4" fill="#99F147" opacity="0.85"/><text x="202" y="558" class="mono" font-size="30" font-weight="700" fill="#FBF4FC" opacity="0.92">03</text><g><circle cx="214" cy="598" r="15.00" fill="none" stroke="#99F147" stroke-width="1" opacity="0.2"/><circle cx="214" cy="598" r="11.10" fill="none" stroke="#99F147" stroke-width="1" opacity="0.3"/><circle cx="214" cy="598" r="7.50" fill="none" stroke="#99F147" stroke-width="1" opacity="0.42"/><circle cx="214" cy="598" r="20.10" fill="none" stroke="#99F147" stroke-width="5" opacity="0.22" stroke-dasharray="1 7" stroke-linecap="round"/><circle cx="214" cy="598" r="6.30" fill="url(#core)" filter="url(#glow)"/><circle cx="214" cy="598" r="2.50" fill="#FFFFFF"/></g><text x="268" y="550" class="ink" font-size="18.5" font-weight="750" text-anchor="start"><tspan x="268" dy="0">One combined, four-state verdict</tspan></text><text x="268" y="578" class="ink2" font-size="13.8" font-weight="400" text-anchor="start"><tspan x="268" dy="0">A verifier checks attestation through Intel and NVIDIA and re-derives the</tspan><tspan x="268" dy="20">answer through Flywheel. Attribution separates a broken run from a wrong</tspan><tspan x="268" dy="20">answer from an unverifiable case.</tspan></text><line x1="254" y1="524" x2="254" y2="638" stroke="rgba(151,132,162,0.12)" stroke-width="1" opacity="1" stroke-linecap="round"/><line x1="778" y1="524" x2="778" y2="638" stroke="rgba(151,132,162,0.12)" stroke-width="1" opacity="1" stroke-linecap="round"/><rect x="792" y="543.0" width="214" height="30" rx="3" fill="rgba(255,255,255,0.015)" stroke="#99F147" stroke-width="1.2"/><rect x="803" y="553.0" width="10" height="10" fill="#99F147"/><text x="822" y="558.0" class="mono" font-size="13.5" font-weight="600" fill="#99F147" dominant-baseline="central" letter-spacing="0.06em">RUN_ATTESTED</text><text x="899" y="579.0" class="mono ok" font-size="18" text-anchor="middle" font-weight="700">+</text><rect x="792" y="589.0" width="214" height="30" rx="3" fill="rgba(255,255,255,0.015)" stroke="#99F147" stroke-width="1.2"/><rect x="803" y="599.0" width="10" height="10" fill="#99F147"/><text x="822" y="604.0" class="mono" font-size="13.5" font-weight="600" fill="#99F147" dominant-baseline="central" letter-spacing="0.06em">ANSWER_MATCHES</text><rect x="172" y="670" width="856" height="150" rx="7" fill="#20112A" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><line x1="120" y1="745.0" x2="172" y2="745.0" stroke="rgba(151,132,162,0.22)" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/><line x1="1028" y1="745.0" x2="1080" y2="745.0" stroke="rgba(151,132,162,0.22)" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/><circle cx="120" cy="745.0" r="3.4" fill="#99F147" opacity="0.85"/><circle cx="1080" cy="745.0" r="3.4" fill="#99F147" opacity="0.85"/><text x="202" y="722" class="mono" font-size="30" font-weight="700" fill="#FBF4FC" opacity="0.92">04</text><g><circle cx="214" cy="762" r="15.00" fill="none" stroke="#99F147" stroke-width="1" opacity="0.2"/><circle cx="214" cy="762" r="11.10" fill="none" stroke="#99F147" stroke-width="1" opacity="0.3"/><circle cx="214" cy="762" r="7.50" fill="none" stroke="#99F147" stroke-width="1" opacity="0.42"/><circle cx="214" cy="762" r="20.10" fill="none" stroke="#99F147" stroke-width="5" opacity="0.22" stroke-dasharray="1 7" stroke-linecap="round"/><circle cx="214" cy="762" r="6.30" fill="url(#core)" filter="url(#glow)"/><circle cx="214" cy="762" r="2.50" fill="#FFFFFF"/></g><text x="268" y="714" class="ink" font-size="18.5" font-weight="750" text-anchor="start"><tspan x="268" dy="0">Flywheel receipt in NEAR&#x27;s provenance log</tspan></text><text x="268" y="742" class="ink2" font-size="13.8" font-weight="400" text-anchor="start"><tspan x="268" dy="0">Attach the re-derivable correctness receipt to the log entry an agent cannot</tspan><tspan x="268" dy="20">rewrite. The log then carries both what ran and whether the answer stood</tspan><tspan x="268" dy="20">up to a re-check.</tspan></text><line x1="254" y1="688" x2="254" y2="802" stroke="rgba(151,132,162,0.12)" stroke-width="1" opacity="1" stroke-linecap="round"/><line x1="778" y1="688" x2="778" y2="802" stroke="rgba(151,132,162,0.12)" stroke-width="1" opacity="1" stroke-linecap="round"/><rect x="792" y="707.0" width="214" height="30" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><rect x="792" y="707.0" width="3.5" height="30" fill="#9784A2"/><text x="806" y="722.0" class="mono" font-size="11.5" font-weight="600" fill="#9784A2" dominant-baseline="central" letter-spacing="0.04em">NEAR</text><text x="845.6" y="722.0" class="mono" font-size="11.5" fill="#DDD4E0" dominant-baseline="central">provenance log</text><rect x="792" y="753.0" width="214" height="30" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><rect x="792" y="753.0" width="3.5" height="30" fill="#99F147"/><text x="806" y="768.0" class="mono" font-size="11.5" font-weight="600" fill="#99F147" dominant-baseline="central" letter-spacing="0.04em">FLYW</text><text x="845.6" y="768.0" class="mono" font-size="11.5" fill="#DDD4E0" dominant-baseline="central">correctness receipt</text><rect x="172" y="834" width="856" height="150" rx="7" fill="#20112A" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><line x1="120" y1="909.0" x2="172" y2="909.0" stroke="rgba(151,132,162,0.22)" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/><line x1="1028" y1="909.0" x2="1080" y2="909.0" stroke="rgba(151,132,162,0.22)" stroke-width="1.2" opacity="0.7" stroke-linecap="round"/><circle cx="120" cy="909.0" r="3.4" fill="#99F147" opacity="0.85"/><circle cx="1080" cy="909.0" r="3.4" fill="#99F147" opacity="0.85"/><text x="202" y="886" class="mono" font-size="30" font-weight="700" fill="#FBF4FC" opacity="0.92">05</text><g><circle cx="214" cy="926" r="15.00" fill="none" stroke="#99F147" stroke-width="1" opacity="0.2"/><circle cx="214" cy="926" r="11.10" fill="none" stroke="#99F147" stroke-width="1" opacity="0.3"/><circle cx="214" cy="926" r="7.50" fill="none" stroke="#99F147" stroke-width="1" opacity="0.42"/><circle cx="214" cy="926" r="20.10" fill="none" stroke="#99F147" stroke-width="5" opacity="0.22" stroke-dasharray="1 7" stroke-linecap="round"/><circle cx="214" cy="926" r="6.30" fill="url(#core)" filter="url(#glow)"/><circle cx="214" cy="926" r="2.50" fill="#FFFFFF"/></g><text x="268" y="878" class="ink" font-size="18.5" font-weight="750" text-anchor="start"><tspan x="268" dy="0">MCP composition for market.near.ai</tspan></text><text x="268" y="906" class="ink2" font-size="13.8" font-weight="400" text-anchor="start"><tspan x="268" dy="0">An agent calls verification as a step: run confidentially on NEAR AI, bind a</tspan><tspan x="268" dy="20">Flywheel receipt, and publish both. The seam is a data contract, so either</tspan><tspan x="268" dy="20">side changes without breaking the other.</tspan></text><line x1="254" y1="852" x2="254" y2="966" stroke="rgba(151,132,162,0.12)" stroke-width="1" opacity="1" stroke-linecap="round"/><line x1="778" y1="852" x2="778" y2="966" stroke="rgba(151,132,162,0.12)" stroke-width="1" opacity="1" stroke-linecap="round"/><rect x="792" y="871.0" width="214" height="30" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><rect x="792" y="871.0" width="3.5" height="30" fill="#9784A2"/><text x="806" y="886.0" class="mono" font-size="11.5" font-weight="600" fill="#9784A2" dominant-baseline="central" letter-spacing="0.04em">NEAR</text><text x="845.6" y="886.0" class="mono" font-size="11.5" fill="#DDD4E0" dominant-baseline="central">market.near.ai agent</text><rect x="792" y="917.0" width="214" height="30" rx="3" fill="rgba(255,255,255,0.02)" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><rect x="792" y="917.0" width="3.5" height="30" fill="#99F147"/><text x="806" y="932.0" class="mono" font-size="11.5" font-weight="600" fill="#99F147" dominant-baseline="central" letter-spacing="0.04em">FLYW</text><text x="845.6" y="932.0" class="mono" font-size="11.5" fill="#DDD4E0" dominant-baseline="central">verify over MCP</text><rect x="56" y="1014" width="1088" height="74" rx="8" fill="rgba(255,131,52,0.05)" stroke="rgba(255,131,52,0.34)" stroke-width="1"/><rect x="56" y="1014" width="4" height="74" fill="#FF8334"/><text x="84" y="1041" class="mono amber" font-size="12" letter-spacing="0.14em">WHAT IT DOES NOT CLAIM</text><text x="84" y="1064" class="ink2" font-size="14.5" font-weight="400" text-anchor="start"><tspan x="84" dy="0">Attestation proves the run, not that the output is correct. A receipt proves a check reproduces, not that the answer is true of the world.</tspan></text><line x1="56" y1="1110" x2="1144" y2="1110" stroke="rgba(151,132,162,0.12)" stroke-width="1" opacity="1" stroke-linecap="round"/><text x="56" y="1136" class="mono faint" font-size="12" letter-spacing="0.12em">FLYWHEEL  x  NEAR AI</text><text x="1144" y="1136" class="mono faint" font-size="12" text-anchor="end">value in the small and in the whole</text></svg>