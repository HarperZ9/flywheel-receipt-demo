<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 852" width="1280" height="852" role="img" aria-labelledby="t d" font-size="15"><title id="t">How a Flywheel receipt re-derives</title><desc id="d">A task is accepted only by an oracle, a test runner, or a data-only certificate checker; an accepted result emits a proof envelope; an independent witness re-runs the recorded check and returns match, drift, or unverifiable.</desc><style>
    text { font-family:'Hanken Grotesk','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
    .mono { font-family:'Conso',ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,monospace; }
    .ink{fill:#FBF4FC} .ink2{fill:#DDD4E0} .muted{fill:#C2B3C8} .faint{fill:#9784A2}
    .ok{fill:#99F147} .amber{fill:#FF8334} .red{fill:#E23A3D}
    .lbl{letter-spacing:0.16em}
    </style><defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#1B0A23"/>
      <stop offset="100%" stop-color="#14041B"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#99F147"/>
      <stop offset="100%" stop-color="#99F147" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/></filter>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#C2B3C8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arwok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#99F147" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs><rect width="1280" height="852" fill="#14041B"/><rect width="1280" height="852" fill="url(#bg)"/><rect width="1280" height="852" filter="url(#grain)" opacity="0.030"/><text x="56" y="74" class="ink" font-size="33" font-weight="800" text-anchor="start"><tspan x="56" dy="0">How a Flywheel receipt re-derives</tspan></text><text x="56" y="106" class="muted" font-size="16.5" font-weight="400" text-anchor="start"><tspan x="56" dy="0">The path that accepts an answer has no learned model on it. An accepted answer carries a check a stranger re-runs offline.</tspan></text><text x="1224" y="74" class="mono faint" font-size="13" text-anchor="end" letter-spacing="0.16em">FIGURE 02</text><rect x="56" y="176" width="150" height="236" rx="8" fill="#20112A" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><rect x="56" y="176" width="150" height="3.5" fill="#9784A2" opacity="0.85"/><text x="78" y="210" class="mono faint" font-size="11.5" letter-spacing="0.16em">INPUT</text><text x="78" y="242" class="ink" font-size="19" font-weight="750" text-anchor="start"><tspan x="78" dy="0">Task</tspan></text><text x="78" y="279" class="ink2" font-size="13.6" font-weight="400" text-anchor="start"><tspan x="78" dy="0">A question or</tspan><tspan x="78" dy="19.5">a unit of work.</tspan></text><rect x="250" y="176" width="360" height="236" rx="8" fill="#20112A" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><rect x="250" y="176" width="360" height="3.5" fill="#99F147" opacity="0.85"/><text x="272" y="210" class="mono faint" font-size="11.5" letter-spacing="0.16em">ACCEPTANCE</text><text x="272" y="242" class="ink" font-size="18" font-weight="750" text-anchor="start"><tspan x="272" dy="0">Only a checker accepts</tspan></text><text x="272" y="279" class="ink2" font-size="13.6" font-weight="400" text-anchor="start"><tspan x="272" dy="0">Stdlib-only and model-free. Only an oracle, a</tspan><tspan x="272" dy="19.5">test runner, or a data-only certificate checker</tspan><tspan x="272" dy="19.5">that never executes what it checks accepts.</tspan><tspan x="272" dy="19.5"></tspan><tspan x="272" dy="19.5">Four-way verdict, with attribution that</tspan><tspan x="272" dy="19.5">separates a wrong answer from a broken run.</tspan></text><rect x="272" y="372" width="76" height="22" rx="2.5" fill="none" stroke="#99F147" stroke-width="1" opacity="0.9"/><text x="310" y="383" class="mono" font-size="9.6" fill="#99F147" text-anchor="middle" dominant-baseline="central" letter-spacing="0.02em">PASS</text><rect x="356" y="372" width="76" height="22" rx="2.5" fill="none" stroke="#E23A3D" stroke-width="1" opacity="0.9"/><text x="394" y="383" class="mono" font-size="9.6" fill="#E23A3D" text-anchor="middle" dominant-baseline="central" letter-spacing="0.02em">FAIL</text><rect x="440" y="372" width="76" height="22" rx="2.5" fill="none" stroke="#FF8334" stroke-width="1" opacity="0.9"/><text x="478" y="383" class="mono" font-size="9.6" fill="#FF8334" text-anchor="middle" dominant-baseline="central" letter-spacing="0.02em">UNDECIDED</text><rect x="524" y="372" width="76" height="22" rx="2.5" fill="none" stroke="#9784A2" stroke-width="1" opacity="0.9"/><text x="562" y="383" class="mono" font-size="9.6" fill="#9784A2" text-anchor="middle" dominant-baseline="central" letter-spacing="0.02em">UNVERIFIABLE</text><rect x="654" y="176" width="250" height="236" rx="8" fill="#20112A" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><rect x="654" y="176" width="250" height="3.5" fill="#99F147" opacity="0.85"/><text x="676" y="210" class="mono faint" font-size="11.5" letter-spacing="0.16em">EMITTED</text><text x="676" y="242" class="ink" font-size="19" font-weight="750" text-anchor="start"><tspan x="676" dy="0">Proof envelope</tspan></text><text x="676" y="279" class="ink2" font-size="13.6" font-weight="400" text-anchor="start"><tspan x="676" dy="0">Records the exact check and</tspan><tspan x="676" dy="19.5">the hash. Travels with the</tspan><tspan x="676" dy="19.5">result as its receipt.</tspan></text><rect x="948" y="176" width="250" height="236" rx="8" fill="#20112A" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><rect x="948" y="176" width="250" height="3.5" fill="#99F147" opacity="0.85"/><text x="970" y="210" class="mono faint" font-size="11.5" letter-spacing="0.16em">RE-CHECK</text><text x="970" y="242" class="ink" font-size="19" font-weight="750" text-anchor="start"><tspan x="970" dy="0">Independent witness</tspan></text><text x="970" y="279" class="ink2" font-size="13.6" font-weight="400" text-anchor="start"><tspan x="970" dy="0">Re-runs the recorded check</tspan><tspan x="970" dy="19.5">offline and recomputes the</tspan><tspan x="970" dy="19.5">hash. Touches neither</tspan><tspan x="970" dy="19.5">original machine.</tspan></text><line x1="206" y1="294.0" x2="250" y2="294.0" stroke="#C2B3C8" stroke-width="1.5" opacity="1" marker-end="url(#arw)" stroke-linecap="round"/><line x1="610" y1="294.0" x2="654" y2="294.0" stroke="#C2B3C8" stroke-width="1.5" opacity="1" marker-end="url(#arw)" stroke-linecap="round"/><line x1="904" y1="294.0" x2="948" y2="294.0" stroke="#C2B3C8" stroke-width="1.5" opacity="1" marker-end="url(#arw)" stroke-linecap="round"/><line x1="1073.0" y1="412" x2="1073.0" y2="512" stroke="#C2B3C8" stroke-width="1.5" opacity="1" stroke-linecap="round"/><line x1="258" y1="512" x2="1022" y2="512" stroke="#C2B3C8" stroke-width="1.5" opacity="1" stroke-linecap="round"/><line x1="258" y1="512" x2="258" y2="546" stroke="#C2B3C8" stroke-width="1.5" opacity="1" marker-end="url(#arw)" stroke-linecap="round"/><line x1="640" y1="512" x2="640" y2="546" stroke="#C2B3C8" stroke-width="1.5" opacity="1" marker-end="url(#arw)" stroke-linecap="round"/><line x1="1022" y1="512" x2="1022" y2="546" stroke="#C2B3C8" stroke-width="1.5" opacity="1" marker-end="url(#arw)" stroke-linecap="round"/><rect x="108.0" y="546" width="300" height="96" rx="6" fill="rgba(255,255,255,0.012)" stroke="#99F147" stroke-width="1.3"/><rect x="124.0" y="568.0" width="11" height="11" fill="#99F147"/><text x="146.0" y="576.0" class="mono" font-size="16" font-weight="700" fill="#99F147" letter-spacing="0.05em">MATCH</text><text x="124.0" y="602.0" class="ink2" font-size="13" font-weight="400" text-anchor="start"><tspan x="124.0" dy="0">The check reproduces.</tspan><tspan x="124.0" dy="18">The verdict re-derives.</tspan></text><rect x="490.0" y="546" width="300" height="96" rx="6" fill="rgba(255,255,255,0.012)" stroke="#FF8334" stroke-width="1.3"/><rect x="506.0" y="568.0" width="11" height="11" fill="#FF8334"/><text x="528.0" y="576.0" class="mono" font-size="16" font-weight="700" fill="#FF8334" letter-spacing="0.05em">DRIFT</text><text x="506.0" y="602.0" class="ink2" font-size="13" font-weight="400" text-anchor="start"><tspan x="506.0" dy="0">The check does not</tspan><tspan x="506.0" dy="18">reproduce. Flagged, not hidden.</tspan></text><rect x="872.0" y="546" width="300" height="96" rx="6" fill="rgba(255,255,255,0.012)" stroke="#9784A2" stroke-width="1.3"/><rect x="888.0" y="568.0" width="11" height="11" fill="#9784A2"/><text x="910.0" y="576.0" class="mono" font-size="16" font-weight="700" fill="#9784A2" letter-spacing="0.05em">UNVERIFIABLE</text><text x="888.0" y="602.0" class="ink2" font-size="13" font-weight="400" text-anchor="start"><tspan x="888.0" dy="0">The environment could</tspan><tspan x="888.0" dy="18">not run the check.</tspan></text><rect x="56" y="700" width="1168" height="66" rx="8" fill="rgba(255,131,52,0.05)" stroke="rgba(255,131,52,0.34)" stroke-width="1"/><rect x="56" y="700" width="4" height="66" fill="#FF8334"/><text x="84" y="727" class="mono amber" font-size="12" letter-spacing="0.14em">HONEST NULL</text><text x="84" y="748" class="ink2" font-size="14.5" font-weight="400" text-anchor="start"><tspan x="84" dy="0">On the shipped benchmark the verified loop shows no accuracy gain over single-shot yet. The value today is the re-derivable receipt and the containment.</tspan></text><line x1="56" y1="800" x2="1224" y2="800" stroke="rgba(151,132,162,0.12)" stroke-width="1" opacity="1" stroke-linecap="round"/><text x="56" y="826" class="mono faint" font-size="12" letter-spacing="0.12em">FLYWHEEL  x  NEAR AI</text><text x="1224" y="826" class="mono faint" font-size="12" text-anchor="end">no receipt, no accept</text></svg>