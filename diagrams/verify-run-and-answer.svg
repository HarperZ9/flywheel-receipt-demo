<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 852" width="1280" height="852" role="img" aria-labelledby="t d" font-size="15"><title id="t">Verify the run and the answer, end to end</title><desc id="d">NEAR AI attests the run in sealed hardware; Flywheel re-derives the answer with a receipt a stranger re-runs; the two bind at one seam into a single end-to-end verification.</desc><style>
    text { font-family:'Hanken Grotesk','Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }
    .mono { font-family:'Conso',ui-monospace,'SFMono-Regular','Cascadia Code',Consolas,monospace; }
