    </linearGradient>
  </defs><rect width="1280" height="852" fill="#14041B"/><rect width="1280" height="852" fill="url(#bg)"/><rect width="1280" height="852" filter="url(#grain)" opacity="0.030"/><text x="56" y="74" class="ink" font-size="33" font-weight="800" text-anchor="start"><tspan x="56" dy="0">Verify the run and the answer, end to end</tspan></text><text x="56" y="106" class="muted" font-size="16.5" font-weight="400" text-anchor="start"><tspan x="56" dy="0">NEAR AI proves what ran. Flywheel proves the answer holds up to a skeptic. They bind at one seam.</tspan></text><text x="1224" y="74" class="mono faint" font-size="13" text-anchor="end" letter-spacing="0.16em">FIGURE 01</text><rect x="56" y="150" width="496" height="468" rx="8" fill="#20112A" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><path d="M56,165 L56,150 L71,150" fill="none" stroke="#99F147" stroke-width="1.6" opacity="0.85"/><path d="M537,150 L552,150 L552,165" fill="none" stroke="#99F147" stroke-width="1.6" opacity="0.85"/><path d="M552,603 L552,618 L537,618" fill="none" stroke="#99F147" stroke-width="1.6" opacity="0.85"/><path d="M71,618 L56,618 L56,603" fill="none" stroke="#99F147" stroke-width="1.6" opacity="0.85"/><text x="84" y="190" class="mono faint" font-size="13" letter-spacing="0.18em">NEAR AI</text><text x="84" y="232" class="ink" font-size="25" font-weight="800" text-anchor="start"><tspan x="84" dy="0">Attests the run</tspan></text><g stroke="#99F147" stroke-width="1.6" fill="none" opacity="0.92"><rect x="84" y="262" width="46" height="46" rx="4"/><line x1="75" y1="274" x2="84" y2="274"/><line x1="130" y1="274" x2="139" y2="274"/><line x1="96" y1="253" x2="96" y2="262"/><line x1="96" y1="308" x2="96" y2="317"/><line x1="75" y1="285" x2="84" y2="285"/><line x1="130" y1="285" x2="139" y2="285"/><line x1="107" y1="253" x2="107" y2="262"/><line x1="107" y1="308" x2="107" y2="317"/><line x1="75" y1="296" x2="84" y2="296"/><line x1="130" y1="296" x2="139" y2="296"/><line x1="118" y1="253" x2="118" y2="262"/><line x1="118" y1="308" x2="118" y2="317"/><path d="M100,286 l6,6 l10,-13" stroke="#99F147" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84" y="356" class="ink2" font-size="15.5" font-weight="400" text-anchor="start"><tspan x="84" dy="0">Confidential inference in sealed hardware.</tspan><tspan x="84" dy="22">Intel TDX and NVIDIA Confidential Computing,</tspan><tspan x="84" dy="22">via the Phala Private ML SDK.</tspan></text><circle cx="90" cy="428" r="2.4" fill="#99F147"/><text x="106" y="432" class="ink2" font-size="15.5" font-weight="400" text-anchor="start"><tspan x="106" dy="0">Attestation quote over the model image,</tspan><tspan x="106" dy="22">the code path, and the request.</tspan></text><circle cx="90" cy="476" r="2.4" fill="#99F147"/><text x="106" y="480" class="ink2" font-size="15.5" font-weight="400" text-anchor="start"><tspan x="106" dy="0">Verifiable through Intel and NVIDIA</tspan><tspan x="106" dy="22">attestation services.</tspan></text><rect x="84" y="522" width="190" height="34" rx="3" fill="rgba(255,255,255,0.015)" stroke="#99F147" stroke-width="1.2"/><rect x="95" y="534.0" width="10" height="10" fill="#99F147"/><text x="114" y="539.0" class="mono" font-size="13.5" font-weight="600" fill="#99F147" dominant-baseline="central" letter-spacing="0.06em">RUN_ATTESTED</text><text x="84" y="588" class="ok" font-size="16.5" font-weight="700" text-anchor="start"><tspan x="84" dy="0">Proves what ran.</tspan></text><rect x="728" y="150" width="496" height="468" rx="8" fill="#20112A" stroke="rgba(151,132,162,0.22)" stroke-width="1"/><path d="M728,165 L728,150 L743,150" fill="none" stroke="#99F147" stroke-width="1.6" opacity="0.85"/><path d="M1209,150 L1224,150 L1224,165" fill="none" stroke="#99F147" stroke-width="1.6" opacity="0.85"/><path d="M1224,603 L1224,618 L1209,618" fill="none" stroke="#99F147" stroke-width="1.6" opacity="0.85"/><path d="M743,618 L728,618 L728,603" fill="none" stroke="#99F147" stroke-width="1.6" opacity="0.85"/><text x="756" y="190" class="mono faint" font-size="13" letter-spacing="0.18em">FLYWHEEL</text><text x="756" y="232" class="ink" font-size="25" font-weight="800" text-anchor="start"><tspan x="756" dy="0">Re-derives the answer</tspan></text><g stroke="#99F147" stroke-width="1.6" fill="none" opacity="0.92"><path d="M756,262 h34 v46 l-7,-5 l-6,5 l-6,-5 l-6,5 l-9,-5 z"/><line x1="763" y1="273" x2="783" y2="273" opacity="0.8"/><line x1="763" y1="282" x2="783" y2="282" opacity="0.8"/><line x1="763" y1="291" x2="783" y2="291" opacity="0.8"/><path d="M800,292 a12,12 0 1 1 -3,-8" /><path d="M797,280 l6,3 l-3,6" stroke-linejoin="round"/></g><circle cx="762" cy="352" r="2.4" fill="#99F147"/><text x="778" y="356" class="ink2" font-size="15.5" font-weight="400" text-anchor="start"><tspan x="778" dy="0">An accepted result emits a proof envelope.</tspan></text><circle cx="762" cy="400" r="2.4" fill="#99F147"/><text x="778" y="404" class="ink2" font-size="15.5" font-weight="400" text-anchor="start"><tspan x="778" dy="0">A third party re-runs it offline and reaches</tspan><tspan x="778" dy="22">the same verdict.</tspan></text><circle cx="762" cy="466" r="2.4" fill="#99F147"/><text x="778" y="470" class="ink2" font-size="15.5" font-weight="400" text-anchor="start"><tspan x="778" dy="0">No learned model on the accept path. Only an</tspan><tspan x="778" dy="22">oracle, a test runner, or a data-only</tspan><tspan x="778" dy="22">certificate checker accepts.</tspan></text><rect x="756" y="522" width="210" height="34" rx="3" fill="rgba(255,255,255,0.015)" stroke="#99F147" stroke-width="1.2"/><rect x="767" y="534.0" width="10" height="10" fill="#99F147"/><text x="786" y="539.0" class="mono" font-size="13.5" font-weight="600" fill="#99F147" dominant-baseline="central" letter-spacing="0.06em">ANSWER_MATCHES</text><text x="756" y="588" class="ok" font-size="16.5" font-weight="700" text-anchor="start"><tspan x="756" dy="0">Proves the answer holds up to a skeptic.</tspan></text><te