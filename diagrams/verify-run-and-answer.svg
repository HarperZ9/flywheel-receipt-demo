rty.</tspan></text><rect x="56" y="640" width="1168" height="118" rx="8" fill="rgba(255,131,52,0.05)" stroke="rgba(255,131,52,0.34)" stroke-width="1"/><rect x="56" y="640" width="4" height="118" fill="#FF8334"/><text x="84" y="674" class="mono amber" font-size="12.5" letter-spacing="0.16em">WHAT NEITHER HALF CLAIMS</text><text x="84" y="702" class="ink2" font-size="15.5" font-weight="400" text-anchor="start"><tspan x="84" dy="0">Attestation cannot show an output is correct. A sealed enclave can still return a confident wrong answer.</tspan><tspan x="84" dy="24">Re-derivation cannot show which physical model produced the output. Bound together, they cover both.</tspan></text><line x1="56" y1="800" x2="1224" y2="800" stroke="rgba(151,132,162,0.12)" stroke-width="1" opacity="1" stroke-linecap="round"/><text x="56" y="826" class="mono faint" font-size="12" letter-spacing="0.12em">FLYWHEEL  x  NEAR AI</text><text x="1224" y="826" class="mono faint" font-size="12" text-anchor="end">attest the run  .  re-derive the answer</text></svg>