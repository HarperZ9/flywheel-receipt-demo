name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the engine at the version the demo was verified on
        run: python -m pip install flywheel-verify==1.0.0 pytest
      - name: Run the receipt demo (honest MATCH, forged DRIFT)
        working-directory: demo
        run: python run_demo.py
  art-receipts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify art receipt digests
        run: python3 scripts/check_art_receipts.py
